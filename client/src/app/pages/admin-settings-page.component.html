<div class="page-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>Global settings</h1><p class="muted">These settings affect all users and the shared cache. Secret values are masked in responses and omitted when unchanged.</p></div></div>
@for (group of groups; track group.title) {<section class="panel settings-group"><h2>{{ group.title }}</h2><div class="settings-grid">@for (key of group.keys; track key) {<label>{{ key }}<input [type]="secretSettings.has(key) ? 'password' : 'text'" [value]="value(key)" (input)="valueChange.emit({key, value: $any($event.target).value})" [placeholder]="secretSettings.has(key) ? 'Leave masked to keep current value' : ''"><small class="muted">{{ secretSettings.has(key) ? 'Secret · stored server-side and never shown to normal users' : 'Administrator-controlled global value' }}</small></label>}</div></section>}
<button class="primary" type="button" (click)="save.emit()" [disabled]="saving">{{ saving ? 'Saving…' : 'Save all settings' }}</button>
