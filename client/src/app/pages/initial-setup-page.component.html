<section class="auth-layout"><div class="brand-panel"><p class="eyebrow">INITIAL SETUP</p><h1>Create the first administrator.</h1><p class="lede">Enter the one-time setup token from <code>FINTUBE_SETUP_ADMIN_TOKEN</code> or the local <code>data/setup-admin-token</code> file.</p></div><section class="auth-card"><div class="wordmark"><span>FIN</span>TUBE</div><p class="eyebrow">ADMINISTRATOR SETUP</p><h2>Secure this instance</h2><form (ngSubmit)="submit()" novalidate><label for="setupToken">Setup token</label><input id="setupToken" name="setupToken" [(ngModel)]="token" type="password" required autocomplete="off"><label for="setupUsername">Username</label><input id="setupUsername" name="username" [(ngModel)]="username" required maxlength="48"><label for="setupEmail">Email <span class="muted">(optional)</span></label><input id="setupEmail" name="email" [(ngModel)]="email" type="email"><label for="setupPassword">Password</label><input id="setupPassword" name="password" [(ngModel)]="password" type="password" minlength="12" required><label for="setupPasswordConfirmation">Confirm password</label><input id="setupPasswordConfirmation" name="passwordConfirmation" [(ngModel)]="confirmation" type="password" minlength="12" required><button class="primary wide" type="submit" [disabled]="loading">{{ loading ? 'Creating…' : 'Create administrator' }}</button></form></section></section>
