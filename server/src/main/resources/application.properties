spring.application.name=fintube
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.tomcat.threads.max=50
fintube.data-dir=${FINTUBE_DATA_DIR:./data}
fintube.admin-username=${ADMIN_USERNAME:}
fintube.admin-password=${ADMIN_PASSWORD:}
fintube.cookie-secure=${FINTUBE_COOKIE_SECURE:false}
# Optional AES-256 settings key. If omitted, a random owner-readable key is
# created at <FINTUBE_DATA_DIR>/settings.key and reused across restarts.
fintube.settings-key=${FINTUBE_SETTINGS_KEY:}
