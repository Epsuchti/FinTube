spring.application.name=fintube
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
server.tomcat.threads.max=50
fintube.data-dir=${FINTUBE_DATA_DIR:${user.dir}/data}
# Used only while there is no ADMIN account. It is never returned by the API.
fintube.setup-admin-token=${FINTUBE_SETUP_ADMIN_TOKEN:}
fintube.cookie-secure=${FINTUBE_COOKIE_SECURE:false}
# Optional AES-256 settings key. If omitted, a random owner-readable key is
# created at <FINTUBE_DATA_DIR>/settings.key and reused across restarts.
fintube.settings-key=${FINTUBE_SETTINGS_KEY:}
# Liquibase owns the schema. Hibernate must never create or alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:file:${fintube.data-dir}/fintube-h2;AUTO_SERVER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=KEY,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
