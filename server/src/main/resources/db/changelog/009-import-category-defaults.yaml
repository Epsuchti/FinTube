databaseChangeLog:
  - changeSet:
      id: 009-import-category-defaults
      author: fintube
      changes:
        - sql:
            sql: >-
              INSERT INTO settings (key, value, secret, updated_at)
              SELECT 'initial_short_import_count', '0', 0, '1970-01-01T00:00:00Z'
              WHERE NOT EXISTS (SELECT 1 FROM settings WHERE key = 'initial_short_import_count')
        - sql:
            sql: >-
              INSERT INTO settings (key, value, secret, updated_at)
              SELECT 'initial_live_stream_import_count', '0', 0, '1970-01-01T00:00:00Z'
              WHERE NOT EXISTS (SELECT 1 FROM settings WHERE key = 'initial_live_stream_import_count')
