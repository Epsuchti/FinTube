databaseChangeLog:
  - changeSet:
      id: 014-playback-background-fill-setting
      author: fintube
      changes:
        - sql:
            sql: >-
              INSERT INTO settings (key, value, secret, updated_at)
              SELECT 'background_fill_on_playback', 'true', 0, '1970-01-01T00:00:00Z'
              WHERE NOT EXISTS (SELECT 1 FROM settings WHERE key = 'background_fill_on_playback')
