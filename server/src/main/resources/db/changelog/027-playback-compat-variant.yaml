databaseChangeLog:
  - changeSet:
      id: 027-playback-compat-variant
      author: fintube
      changes:
        - sql:
            sql: >-
              INSERT INTO settings (key, value, secret, updated_at)
              SELECT 'playback_compat_variant', 'true', 0, '1970-01-01T00:00:00Z'
              WHERE NOT EXISTS (SELECT 1 FROM settings WHERE key = 'playback_compat_variant')
