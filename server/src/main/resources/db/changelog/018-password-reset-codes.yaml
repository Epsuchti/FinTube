databaseChangeLog:
  - changeSet:
      id: 018-password-reset-codes
      author: fintube
      changes:
        - createTable:
            tableName: password_resets
            columns:
              - column: {name: user_id, type: bigint, constraints: {primaryKey: true, nullable: false}}
              - column: {name: code_hash, type: varchar(255), constraints: {nullable: false}}
              - column: {name: expires_at, type: varchar(64), constraints: {nullable: false}}
              - column: {name: requested_at, type: varchar(64), constraints: {nullable: false}}
        - addForeignKeyConstraint: {baseTableName: password_resets, baseColumnNames: user_id, constraintName: fk_password_resets_user, referencedTableName: users, referencedColumnNames: id, onDelete: CASCADE}
