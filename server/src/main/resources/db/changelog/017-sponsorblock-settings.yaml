databaseChangeLog:
  - changeSet:
      id: 017-sponsorblock-settings
      author: fintube
      changes:
        - sql:
            sql: >-
              INSERT INTO settings (key, value, secret, updated_at)
              SELECT 'sponsorblock_enabled', 'true', 0, '1970-01-01T00:00:00Z'
              WHERE NOT EXISTS (SELECT 1 FROM settings WHERE key = 'sponsorblock_enabled')
        - sql:
            sql: >-
              INSERT INTO settings (key, value, secret, updated_at)
              SELECT 'sponsorblock_api_url', 'https://api.sponsor.ajay.app', 0, '1970-01-01T00:00:00Z'
              WHERE NOT EXISTS (SELECT 1 FROM settings WHERE key = 'sponsorblock_api_url')
