databaseChangeLog:
  - changeSet:
      id: 026-jellyfin-favorite-downloads
      author: fintube
      changes:
        - sql:
            sql: |
              INSERT INTO settings (key, value, secret, updated_at)
              SELECT 'jellyfin_download_favorites', 'true', 0, '1970-01-01T00:00:00Z'
              WHERE NOT EXISTS (SELECT 1 FROM settings WHERE key = 'jellyfin_download_favorites');
