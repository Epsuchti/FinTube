openapi: 3.0.3
info: { title: FinTube API, version: 1.0.0 }
servers: [ { url: /api } ]
paths:
  /setup/status:
    get: { tags: [ Setup ], operationId: getSetupStatus, responses: { '200': { description: Setup status, content: { application/json: { schema: { $ref: '#/components/schemas/SetupStatus' } } } } } }
  /setup/create-admin:
    post: { tags: [ Setup ], operationId: createInitialAdmin, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAdminRequest' } } } }, responses: { '200': { description: Administrator created, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }, '401': { description: Invalid setup token }, '409': { description: Administrator already exists } } }
  /auth/register:
    post: { tags: [ Authentication ], operationId: register, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } } } }, responses: { '200': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }, '409': { description: Username exists } } }
  /auth/login:
    post: { tags: [ Authentication ], operationId: login, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } } }, responses: { '200': { description: Authenticated, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResult' } } } }, '401': { description: Invalid credentials } } }
  /auth/logout:
    post: { tags: [ Authentication ], operationId: logout, responses: { '200': { description: Signed out }, '401': { description: Unauthenticated } } }
  /auth/password-reset:
    post: { tags: [ Authentication ], operationId: requestPasswordReset, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }, responses: { '202': { description: 'If the username exists, a reset code was written to the server console' } } }
  /auth/password-reset/confirm:
    post: { tags: [ Authentication ], operationId: confirmPasswordReset, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' } } } }, responses: { '200': { description: Password reset }, '400': { description: Invalid or expired code } } }
  /me:
    get: { tags: [ Account ], operationId: getCurrentUser, responses: { '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }, '401': { description: Unauthenticated } } }
  /me/youtube-api-key:
    get: { tags: [ Account ], operationId: getYouTubeApiKeyStatus, responses: { '200': { description: YouTube API key status, content: { application/json: { schema: { $ref: '#/components/schemas/YouTubeApiKeyStatus' } } } }, '401': { description: Unauthenticated } } }
    put: { tags: [ Account ], operationId: updateYouTubeApiKey, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateYouTubeApiKeyRequest' } } } }, responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/YouTubeApiKeyStatus' } } } }, '400': { description: Invalid key }, '401': { description: Unauthenticated } } }
  /subscriptions:
    get: { tags: [ Library ], operationId: listSubscriptions, responses: { '200': { description: Subscriptions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subscription' } } } } } } }
    post: { tags: [ Library ], operationId: addSubscription, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddSubscriptionRequest' } } } }, responses: { '200': { description: Added } } }
  /subscriptions/import-cookies:
    post: { tags: [ Library ], operationId: importSubscriptionsFromCookies, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportCookiesRequest' } } } }, responses: { '200': { description: Imported, content: { application/json: { schema: { $ref: '#/components/schemas/ImportChannelsResult' } } } }, '400': { description: Invalid cookie export or unauthenticated YouTube cookies }, '422': { description: No subscription channels found }, '502': { description: YouTube or proxy request failed }, '504': { description: YouTube subscription import timed out } } }
  /subscriptions/refresh-all:
    post: { tags: [ Library ], operationId: refreshAllSubscriptions, responses: { '200': { description: Refreshed all enabled subscriptions, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshResult' } } } } } }
  /subscriptions/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    patch: { tags: [ Library ], operationId: updateSubscription, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ToggleSubscriptionRequest' } } } }, responses: { '200': { description: Updated } } }
    delete: { tags: [ Library ], operationId: removeSubscription, responses: { '200': { description: Removed } } }
  /subscriptions/{id}/refresh:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    post: { tags: [ Library ], operationId: refreshSubscription, responses: { '200': { description: Refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshResult' } } } } } }
  /videos:
    get:
      tags: [ Library ]
      operationId: listVideos
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 255 } }
      responses: { '200': { description: Paginated videos, content: { application/json: { schema: { $ref: '#/components/schemas/VideoPage' } } } } }
  /videos/{video}/thumbnail:
    parameters: [ { name: video, in: path, required: true, schema: { type: string } } ]
    get: { tags: [ Library ], operationId: getVideoThumbnail, responses: { '200': { description: Video thumbnail, content: { image/jpeg: { schema: { type: string, format: binary } } } }, '404': { description: Thumbnail not found } } }
  /me/change-password:
    post: { tags: [ Account ], operationId: changePassword, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePasswordRequest' } } } }, responses: { '200': { description: Changed } } }
  /admin/settings:
    get: { tags: [ Admin ], operationId: getSettings, responses: { '200': { description: Settings, content: { application/json: { schema: { type: object, additionalProperties: { type: string } } } } } } }
    patch: { tags: [ Admin ], operationId: updateSettings, requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: { type: string } } } } }, responses: { '200': { description: Updated } } }
  /admin/users:
    get: { tags: [ Admin ], operationId: listUsers, responses: { '200': { description: Users, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } } } } } } }
  /admin/users/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    patch: { tags: [ Admin ], operationId: updateUserRole, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateRoleRequest' } } } }, responses: { '200': { description: Updated } } }
  /admin/cache:
    get: { tags: [ Admin ], operationId: listCacheEntries, responses: { '200': { description: Cache, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CacheEntry' } } } } } } }
  /admin/cache/{video}:
    parameters: [ { name: video, in: path, required: true, schema: { type: string } } ]
    delete: { tags: [ Admin ], operationId: deleteCacheEntry, responses: { '200': { description: Deleted } } }
  /admin/jobs:
    get: { tags: [ Admin ], operationId: listJobs, responses: { '200': { description: Jobs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Job' } } } } } } }
  /admin/jobs/{id}/cancel:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post: { tags: [ Admin ], operationId: cancelJob, responses: { '200': { description: Cancelled } } }
  /admin/jellyfin/status:
    get: { tags: [ Admin ], operationId: getJellyfinStatus, responses: { '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/JellyfinStatus' } } } } } }
  /admin/jellyfin/validate:
    post: { tags: [ Admin ], operationId: validateJellyfin, responses: { '200': { description: Validated, content: { application/json: { schema: { $ref: '#/components/schemas/JellyfinStatus' } } } } } }
  /admin/jellyfin/refresh:
    post: { tags: [ Admin ], operationId: refreshJellyfin, responses: { '200': { description: Refreshed, content: { application/json: { schema: { $ref: '#/components/schemas/OperationResult' } } } } } }
components:
  schemas:
    Role: { type: string, enum: [ USER, ADMIN ] }
    SetupStatus: { type: object, required: [ setupRequired ], properties: { setupRequired: { type: boolean } } }
    CreateAdminRequest: { type: object, required: [ username, password, token ], properties: { username: { type: string, minLength: 3, maxLength: 48 }, email: { type: string, format: email }, password: { type: string, minLength: 6, format: password }, token: { type: string, format: password } } }
    RegisterRequest: { type: object, required: [ username, password ], properties: { username: { type: string, minLength: 3, maxLength: 48 }, email: { type: string, format: email }, password: { type: string, minLength: 6, format: password } } }
    LoginRequest: { type: object, required: [ username, password ], properties: { username: { type: string }, password: { type: string, format: password } } }
    PasswordResetRequest: { type: object, required: [ username ], properties: { username: { type: string, minLength: 3, maxLength: 48 } } }
    PasswordResetConfirmRequest: { type: object, required: [ username, code, newPassword ], properties: { username: { type: string, minLength: 3, maxLength: 48 }, code: { type: string, minLength: 16, maxLength: 64, format: password }, newPassword: { type: string, minLength: 6, format: password } } }
    AuthResult: { type: object, required: [ role ], properties: { role: { $ref: '#/components/schemas/Role' }, username: { type: string } } }
    Profile: { type: object, required: [ id, username, role, filesystemSlug ], properties: { id: { type: integer, format: int64 }, username: { type: string }, role: { $ref: '#/components/schemas/Role' }, filesystemSlug: { type: string } } }
    YouTubeApiKeyStatus: { type: object, required: [ configured ], properties: { configured: { type: boolean } } }
    UpdateYouTubeApiKeyRequest: { type: object, required: [ api_key ], properties: { api_key: { type: string, maxLength: 4096 } } }
    AddSubscriptionRequest: { type: object, required: [ channel ], properties: { channel: { type: string } } }
    ImportCookiesRequest: { type: object, required: [ cookies ], properties: { cookies: { type: string, minLength: 1, maxLength: 5000000 } } }
    ImportChannelsResult: { type: object, required: [ imported, skipped, failed ], properties: { imported: { type: integer, minimum: 0 }, skipped: { type: integer, minimum: 0 }, failed: { type: integer, minimum: 0 } } }
    ToggleSubscriptionRequest: { type: object, required: [ enabled ], properties: { enabled: { type: boolean }, initial_import_count: { type: integer, minimum: 0, maximum: 1000 }, short_import_count: { type: integer, minimum: 0, maximum: 1000 }, live_stream_import_count: { type: integer, minimum: 0, maximum: 1000 }, download_count: { type: integer, minimum: 0, maximum: 1000 }, short_download_count: { type: integer, minimum: 0, maximum: 1000 }, live_stream_download_count: { type: integer, minimum: 0, maximum: 1000 } } }
    ChangePasswordRequest: { type: object, required: [ oldPassword, newPassword ], properties: { oldPassword: { type: string }, newPassword: { type: string, minLength: 6 } } }
    UpdateRoleRequest: { type: object, required: [ role ], properties: { role: { $ref: '#/components/schemas/Role' } } }
    RefreshResult: { type: object, properties: { discovered: { type: integer } } }
    OperationResult: { type: object, properties: { success: { type: boolean }, message: { type: string } } }
    Subscription: { type: object, required: [ id, channel_id, name, enabled, initial_import_count, short_import_count, live_stream_import_count, download_count, short_download_count, live_stream_download_count ], properties: { id: { type: integer, format: int64 }, channel_id: { type: string }, name: { type: string }, url: { type: string }, enabled: { type: boolean }, initial_import_count: { type: integer, minimum: 0, maximum: 1000 }, short_import_count: { type: integer, minimum: 0, maximum: 1000 }, live_stream_import_count: { type: integer, minimum: 0, maximum: 1000 }, download_count: { type: integer, minimum: 0, maximum: 1000 }, short_download_count: { type: integer, minimum: 0, maximum: 1000 }, live_stream_download_count: { type: integer, minimum: 0, maximum: 1000 }, last_checked_at: { type: string }, last_successful_sync_at: { type: string } } }
    Video: { type: object, required: [ video_id, title ], properties: { video_id: { type: string }, title: { type: string }, description: { type: string }, published_at: { type: string }, duration_seconds: { type: integer }, channel: { type: string }, thumbnail_url: { type: string }, library_path: { type: string }, cache_status: { type: string }, cache_last_accessed_at: { type: string }, cache_expires_at: { type: string }, cache_bytes: { type: integer, format: int64 }, cached_fragments: { type: integer }, downloaded: { type: boolean } } }
    VideoPage: { type: object, required: [ items, page, page_size, total_elements, total_pages ], properties: { items: { type: array, items: { $ref: '#/components/schemas/Video' } }, page: { type: integer }, page_size: { type: integer }, total_elements: { type: integer, format: int64 }, total_pages: { type: integer } } }
    AdminUser: { type: object, required: [ id, username, role, filesystem_slug, created_at ], properties: { id: { type: integer, format: int64 }, username: { type: string }, email: { type: string }, role: { $ref: '#/components/schemas/Role' }, filesystem_slug: { type: string }, created_at: { type: string } } }
    CacheEntry: { type: object, required: [ video_id, status ], properties: { video_id: { type: string }, video_title: { type: string }, channel_name: { type: string }, format_key: { type: string }, status: { type: string }, last_accessed_at: { type: string }, active_readers: { type: integer }, active_writers: { type: integer } } }
    Job: { type: object, required: [ id, video_id, status, priority, created_at ], properties: { id: { type: string }, video_id: { type: string }, status: { type: string }, priority: { type: integer }, created_at: { type: string }, error: { type: string } } }
    JellyfinStatus: { type: object, additionalProperties: true }
